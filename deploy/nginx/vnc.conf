# noVNC 浏览器画面（按需开启）
#
# 设计：nginx 始终指向 7910（网关），而不是直连 7900。
#   网关进程由面板开关控制启停 —— 关掉时 7910 无人监听，
#   这里立刻返回 502，URL 真正失效；开启时才可用。
#
# 为什么不能直接 proxy_pass 到 7900：
#   7900 是 Selenium 容器的常驻 noVNC，永远在监听。
#   若 nginx 直连它，「关闭观看」就只是个摆设——URL 依然能打开。
#   （此前确实踩了这个坑：关掉后 /vnc-x7k2m9/ 仍返回 200。）
#
# 安全：该 noVNC 免密，能打开即可操作已登录浏览器，
#      因此路径使用不可猜测的随机段。

location ^~ /vnc-x7k2m9/ {
    # 末尾的 / 不能少：/vnc-x7k2m9/xxx -> /xxx，
    # 否则 noVNC 的 websockify 路径会错位
    proxy_pass http://127.0.0.1:7910/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket 升级：缺这两行，画面能打开但永远黑屏
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 画面是长连接，关缓冲并拉长超时
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
